<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服務員管理｜澳門青年就業導航</title><link rel="stylesheet" href="assets/style.css"></head>
<body><header class="header"><a class="brand" href="index.html"><span class="mark">青</span>澳門青年就業導航</a><nav><a href="index.html">返回招聘資訊</a><button id="logout" class="secondary" hidden>登出</button></nav></header>
<main><section id="loginPanel" class="login panel"><p class="eyebrow">STAFF ACCESS</p><h1>服務員登入</h1><p class="muted">登入後可管理此瀏覽器內的招聘資訊。</p><form id="loginForm"><label>管理密碼<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">登入管理介面</button><p id="loginError" role="alert"></p></form><p class="notice">前端密碼僅限制介面存取，請勿在此保存個人資料或機密資訊。</p></section>
<section id="adminPanel" class="section" hidden><div class="section-heading"><div><p class="eyebrow">STAFF WORKSPACE</p><h1>招聘資訊管理</h1></div><button id="newJob">新增崗位</button></div><p class="notice">資料僅保存在此瀏覽器。請定期匯出備份；GitHub Pages 不會同步本地修改。</p>
<div class="admin-layout"><section class="panel"><h2 id="formTitle">新增崗位</h2><div class="ocr-box"><h3>從招聘截圖填寫</h3><p class="muted">選擇圖片進行中英 OCR。辨識可能有誤，請核對所有欄位及招聘連結後再儲存。</p><label>招聘截圖<input id="imageUpload" type="file" accept="image/png,image/jpeg,image/webp,image/bmp"></label><img id="imagePreview" class="preview" alt="招聘截圖預覽" hidden><button id="recognize" type="button" class="secondary" disabled>識別截圖並填入表單</button><p id="ocrStatus" role="status"></p><details id="ocrDetails" hidden><summary>查看及修正識別文字</summary><textarea id="ocrText" rows="7"></textarea><button id="applyOcr" type="button" class="secondary">重新提取欄位</button></details></div>
<form id="jobForm"><label>崗位名字<input name="title" required maxlength="120"></label><label>公司名字<input name="company" required maxlength="120"></label><div class="form-row"><label>薪酬<input name="salary" required maxlength="100" placeholder="例如：MOP 15,000–18,000／月"></label><label>學歷要求<input name="education" required maxlength="100" placeholder="例如：中學、學士、學歷不限"></label></div><div class="form-row"><label>發佈日期<input name="published" type="date" required></label><label>截止日期（選填）<input name="deadline" type="date"></label></div><label>原招聘連結<input name="url" type="url" required placeholder="https://…"></label><p class="muted">只接受 http 或 https 連結；OCR 未能辨識的欄位需手動補上。</p><div class="actions"><button type="submit">確認並儲存崗位</button><button id="cancelEdit" type="button" class="secondary">清空表單</button></div></form></section>
<section class="panel"><div class="section-heading"><h2>已儲存崗位</h2><span id="adminCount" class="muted"></span></div><div class="actions backup"><button id="exportData" class="secondary">匯出 JSON 備份</button><label class="import-label">匯入備份<input id="importData" type="file" accept="application/json,.json"></label></div><div id="adminJobs"></div></section></div></section><p id="message" role="status" class="message" hidden></p></main>
<footer>澳門青年就業導航服務 · 服務員管理</footer><script src="assets/app.js"></script><script src="assets/admin.js"></script></body></html>
