<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>澳門青年就業導航｜招聘資訊</title><meta name="description" content="澳門青年就業導航服務，探索就業與培訓資訊，獲取免費 CV 及面試指導。"><link rel="stylesheet" href="assets/style.css?v=__ASSET_VERSION__"></head>
<body class="public-page"><header class="header"><a class="brand" href="index.html"><span class="mark">青</span>澳門青年就業導航</a><nav aria-label="主要導覽"><a href="service.html">服務簡介</a><a href="#jobs" aria-current="page">招聘資訊</a><a href="admin.html">服務員登入</a></nav></header>
<section class="hero hero-home"><div class="hero-inner"><div class="hero-copy"><p class="eyebrow">MACAU YOUTH CAREER NAVIGATION</p><h1>下一步，由這裡出發。</h1><p class="hero-description">配合你的專業與就業意向，探索工作與成長機會。</p><div class="services"><span>就業資訊配對</span><span>培訓資訊</span><span>免費 CV 指導</span><span>面試指導</span></div></div><img class="hero-art" src="assets/hero-career.png" alt="" aria-hidden="true" fetchpriority="high"></div></section>
<main><section id="jobs" class="job-browser" aria-labelledby="jobsHeading"><form id="searchForm" class="search-panel" role="search"><label class="search-input"><img class="icon" src="assets/icons/magnifying-glass.svg" alt="" aria-hidden="true"><span class="sr-only">搜尋崗位、公司、地點或行業</span><input id="search" type="search" placeholder="搜尋崗位、公司或地點" autocomplete="off"></label><button type="submit" class="search-submit">搜尋職位<img class="icon" src="assets/icons/arrow-right.svg" alt="" aria-hidden="true"></button></form>
<div class="filters filters-expanded"><label>學歷要求<select id="educationFilter"><option value="">全部學歷</option></select></label><label>工作地點<select id="locationFilter"><option value="">全部地點</option></select></label><label>行業<select id="industryFilter"><option value="">全部行業</option></select></label><label>崗位類型<select id="jobTypeFilter"><option value="">全部類型</option></select></label><button id="clearFilters" class="secondary">重設篩選</button></div>
<div class="section-heading jobs-heading"><div><p class="eyebrow">OPPORTUNITIES</p><h2 id="jobsHeading">探索招聘機會</h2></div><div class="results-actions"><span id="resultCount" class="muted" aria-live="polite"></span><button id="refreshJobs" class="text-button" aria-label="更新招聘資訊"><img class="icon" src="assets/icons/arrows-clockwise.svg" alt="" aria-hidden="true">更新資訊</button></div></div>
<div id="jobsList" class="job-grid"></div><div id="emptyState" class="empty" hidden role="status"></div><p class="notice source-note">招聘資訊來自共用資料庫，每分鐘檢查更新。請以原招聘頁面的資訊為準。</p></section>
<section class="about"><div><p class="eyebrow">HERE TO HELP</p><h2>陪伴青年，走好就業每一步</h2><p>澳門青年就業導航服務為有就業煩惱的青年提供就業與培訓資訊，以及免費 CV 與面試指導。</p></div><a class="button secondary" href="service.html">了解我們的服務<img class="icon" src="assets/icons/arrow-right.svg" alt="" aria-hidden="true"></a></section></main>
<footer>澳門青年就業導航服務 · 招聘資訊導航</footer><script src="assets/config.js?v=__ASSET_VERSION__"></script><script src="assets/app.js?v=__ASSET_VERSION__"></script><script src="assets/public.js?v=__ASSET_VERSION__"></script></body></html>
