<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>澳門青年就業導航｜招聘資訊</title><link rel="stylesheet" href="assets/style.css?v=__ASSET_VERSION__"></head>
<body><header class="header"><a class="brand" href="index.html"><span class="mark">青</span>澳門青年就業導航</a><nav><a href="service.html">服務簡介</a><a href="#jobs">招聘資訊</a><a href="admin.html">服務員登入</a></nav></header>
<main><section class="hero"><p class="eyebrow">MACAU YOUTH CAREER NAVIGATION</p><h1>下一步，由這裡出發。</h1><p>配合你的專業與就業意向，探索工作與成長機會。</p><div class="services"><span>就業資訊配對</span><span>培訓資訊</span><span>免費 CV 指導</span><span>面試指導</span></div></section>
<section id="jobs" class="section"><div class="section-heading"><div><p class="eyebrow">OPPORTUNITIES</p><h2>探索招聘機會</h2></div><span id="resultCount" class="muted" aria-live="polite"></span></div>
<div class="filters filters-expanded"><label>搜尋崗位、公司或地點<input id="search" type="search" placeholder="輸入崗位、公司、地點或行業"></label><label>學歷要求<select id="educationFilter"><option value="">全部學歷</option></select></label><label>工作地點<select id="locationFilter"><option value="">全部地點</option></select></label><label>行業<select id="industryFilter"><option value="">全部行業</option></select></label><label>崗位類型<select id="jobTypeFilter"><option value="">全部類型</option></select></label><div class="filter-actions"><button id="refreshJobs" class="secondary">更新資訊</button><button id="clearFilters" class="secondary">重設篩選</button></div></div>
<p class="notice">招聘資訊來自共用資料庫，每分鐘檢查更新。請以原招聘頁面的資訊為準。</p>
<div id="jobsList" class="job-grid"></div><div id="emptyState" class="empty" hidden></div></section>
<section class="about"><h2>陪伴青年，走好就業每一步</h2><p>澳門青年就業導航服務為有就業煩惱的青年提供就業與培訓資訊，以及免費 CV 與面試指導。</p></section></main>
